<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Design Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <header class="sidebar__header">
        <svg class="sidebar__logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="#6366f1"/>
          <path d="M6 10l10 7 10-7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <rect x="6" y="9" width="20" height="14" rx="2" stroke="#fff" stroke-width="2"/>
        </svg>
        <h1 class="sidebar__title">Email Designer</h1>
      </header>

      <!-- API Key -->
      <section class="step" id="step-key">
        <div class="step__label">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" style="color:#6366f1"><path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd"/></svg>
          Anthropic API Key
        </div>
        <div class="url-row">
          <input
            id="api-key"
            class="input input--inline"
            type="password"
            placeholder="sk-ant-…"
            autocomplete="off"
          />
          <button id="btn-set-key" class="btn btn--ghost">Save</button>
        </div>
        <div id="key-status" class="color-status hidden"></div>
        <p style="font-size:11px;color:#94a3b8;margin-top:4px;">Stored in memory only — not saved to disk. Get a key at <strong>console.anthropic.com</strong></p>
      </section>

      <!-- Step 1: Brief -->
      <section class="step" id="step-brief">
        <div class="step__label"><span class="step__num">1</span> Marketing Brief</div>
        <textarea
          id="brief"
          class="input"
          rows="6"
          placeholder="Describe your email campaign…&#10;&#10;Example: Launch email for our new summer collection targeting women 25-40. Tone: warm and aspirational. Include 20% off promo code SUMMER20. CTA to shop now."
        ></textarea>
      </section>

      <!-- Step 2: Brand URL -->
      <section class="step" id="step-url">
        <div class="step__label"><span class="step__num">2</span> Brand Website <span class="badge">optional</span></div>
        <div class="url-row">
          <input
            id="brand-url"
            class="input input--inline"
            type="url"
            placeholder="https://yourbrand.com"
          />
          <button id="btn-extract" class="btn btn--ghost" title="Extract colours">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 11H9v-2h2v2zm0-4H9V7h2v2z"/></svg>
            Extract
          </button>
        </div>
        <div id="color-status" class="color-status hidden"></div>
        <!-- Colour swatches -->
        <div id="color-swatches" class="swatches hidden"></div>
      </section>

      <!-- Generate -->
      <button id="btn-generate" class="btn btn--primary btn--full">
        <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
        Generate Email
      </button>

      <div id="generate-status" class="generate-status hidden"></div>
    </aside>

    <!-- ── Preview ── -->
    <main class="preview-area">
      <div class="preview-toolbar" id="preview-toolbar">
        <div class="toolbar__left">
          <button class="view-btn active" data-width="600" title="Desktop">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path d="M2 4a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4zm14 8V4H4v8h12z"/><path d="M6 16h8v2H6z"/></svg>
          </button>
          <button class="view-btn" data-width="375" title="Mobile">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path d="M7 2a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2H7zm3 13a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>
        </div>
        <div class="toolbar__right">
          <button id="btn-download" class="btn btn--secondary" disabled>
            <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Download HTML
          </button>
        </div>
      </div>

      <div class="preview-container">
        <div class="preview-empty" id="preview-empty">
          <svg viewBox="0 0 64 64" fill="none" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="12" width="48" height="40" rx="4" stroke="#c7d2fe" stroke-width="3"/>
            <path d="M8 22l24 16 24-16" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <p>Your email preview will appear here.</p>
          <p class="preview-empty__sub">Fill in the brief and click <strong>Generate Email</strong>.</p>
        </div>
        <iframe id="preview-frame" class="preview-frame hidden" title="Email preview" sandbox="allow-same-origin"></iframe>
      </div>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
